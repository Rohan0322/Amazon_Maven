trigger:
  branches:
    include:
      - master

variables:
  imageName: 'myapp'
  acrName: 'myacr.azurecr.io'
  tag: '$(Build.BuildId)'

stages:

# =========================
# SONARQUBE
# =========================
- stage: SonarQube
  displayName: "Code Analysis"
  jobs:
    - job: SonarAnalysis
      pool:
        name: 'Default'

      steps:
        - checkout: self

        - script: |
            cd Amazon
            mvn clean verify sonar:sonar \
              -Dsonar.projectKey=my-app \
              -Dsonar.host.url=http://4.155.39.53:9000 \
              -Dsonar.login=sqa_9d6b3f1d8d52f545d3c3d6d46a7674709f08d955
          displayName: "Run SonarQube Scan"

# =========================
# 3: MAVEN BUILD + ARTIFACT
# =========================
- stage: Build
  displayName: "Build & Artifact"
  dependsOn: SonarQube
  jobs:
    - job: MavenBuild
      pool:
        name: 'Default'

      steps:
        - checkout: self

        - task: Maven@3
          inputs:
            mavenPomFile: 'Amazon/pom.xml'
            goals: 'clean package'
            publishJUnitResults: true

        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: 'Amazon/Amazon-Web/target'
            artifactName: 'drop'

# =========================
# 4: DOCKER BUILD
# =========================


- stage: DockerBuild
  displayName: "Build Docker Image"
  dependsOn: Build
  jobs:
    - job: DockerBuildJob
      pool:
        name: 'Default'

      steps:
        - checkout: self

        - script: |
           echo "==== DEBUG FILES ===="
           pwd
           ls -R
          displayName: "Debug WAR location"

        - task: Docker@2
          inputs:
            containerRegistry: 'ACR'
            repository: '$(imageName)'
            command: 'build'
            Dockerfile: '**/Dockerfile'
            tags: |
              $(tag)

# =========================
# 5: PUSH TO ACR
# =========================
- stage: Push
  displayName: "Push to ACR"
  dependsOn: DockerBuild
  jobs:
    - job: PushJob
      pool:
        name: 'Default'
        
      steps:
        - task: Docker@2
          inputs:
            containerRegistry: 'ACR'
            repository: '$(imageName)'
            command: 'push'
            tags: |
              $(tag)

# =========================
# 6: TRIVY SCAN
# =========================
- stage: SecurityScan
  displayName: "Trivy Scan"
  dependsOn: Push
  jobs:
    - job: TrivyScan
      pool:
        name: 'Default'
        
      
      steps:
        - script: |
            wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.50.0_Linux-64bit.tar.gz
            tar zxvf trivy*.tar.gz
            sudo mv trivy /usr/local/bin/

            trivy image --exit-code 0 --severity HIGH,CRITICAL $(acrName)/$(imageName):$(tag)
          displayName: "Scan Docker Image"

# =========================
# 7: DEPLOY TO AKS
# =========================
- stage: Deploy
  displayName: "Deploy to AKS"
  dependsOn: SecurityScan
  jobs:
    - job: DeployJob
      pool:
        name: 'Default'
        
      steps:
        - task: Kubernetes@1
          inputs:
            connectionType: 'Kubernetes Service Connection'
            kubernetesServiceEndpoint: 'AKS'
            namespace: default
            command: apply
            useConfigurationFile: true
            configuration: 'k8s/deployment.yaml'